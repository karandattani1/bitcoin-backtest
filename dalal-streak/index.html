<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dalal Streak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one centred phone-width column; a winding lesson path between a sticky stat bar and a fixed tab bar; lessons open full-screen. */
:root {
  --bg: #F2F5EE;
  --surface: #FFFFFF;
  --ink: #12261F;
  --muted: #5A6D64;
  --line: #DBE3D8;
  --brand: #0E7C5A;
  --saffron: #E0780E;
  --good: #1A8F4C;
  --good-bg: #DDF4E5;
  --bad: #C93B3B;
  --bad-bg: #FBE4E1;
  --locked: #E1E7DE;
  --locked-ink: #9AA79F;
  --heart: #E5484D;
  --flame: #F08A12;
  --bolt: #D9A400;
  --u1: #0E7C5A; --u2: #2B65AE; --u3: #B85F07; --u4: #7446BF;
  --u5: #0C7F81; --u6: #B5410C; --u7: #AD2E5B;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1814; --surface: #16231E; --ink: #E6EFEA; --muted: #93A79E; --line: #263830;
    --brand: #23A877; --saffron: #F29A35; --good: #3CC87C; --good-bg: #12301F; --bad: #F06A6A; --bad-bg: #3A1B1B;
    --locked: #24322C; --locked-ink: #5E7068; --heart: #FF6369; --flame: #FF9F2E; --bolt: #F2C230;
    --u1: #1E9E70; --u2: #3B7BD0; --u3: #C9700F; --u4: #8A5CD6; --u5: #13989A; --u6: #CF5418; --u7: #C63E6E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1814; --surface: #16231E; --ink: #E6EFEA; --muted: #93A79E; --line: #263830;
  --brand: #23A877; --saffron: #F29A35; --good: #3CC87C; --good-bg: #12301F; --bad: #F06A6A; --bad-bg: #3A1B1B;
  --locked: #24322C; --locked-ink: #5E7068; --heart: #FF6369; --flame: #FF9F2E; --bolt: #F2C230;
  --u1: #1E9E70; --u2: #3B7BD0; --u3: #C9700F; --u4: #8A5CD6; --u5: #13989A; --u6: #CF5418; --u7: #C63E6E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 560px; margin: 0 auto; }

/* ---------- top stat bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--line); }
.topbar .col { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.wordmark { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: -0.01em; color: var(--brand); white-space: nowrap; }
.wordmark span { color: var(--saffron); }
.stats { display: flex; gap: 14px; }
.stat { display: flex; align-items: center; gap: 5px; font-weight: 800; font-family: var(--f-mono); font-size: 15px; }
.stat svg { width: 22px; height: 22px; }
.stat.flame { color: var(--flame); } .stat.bolt { color: var(--bolt); } .stat.heart { color: var(--heart); }
.stat.off { color: var(--locked-ink); }

main.app { padding-block: 16px 120px; }
.view[hidden] { display: none !important; }

/* ---------- daily goal ---------- */
.goal { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.goal-meta { flex: 1; min-width: 0; }
.goal-meta b { display: block; font-size: 15px; }
.goal-meta small { color: var(--muted); font-size: 13px; }
.bar { height: 12px; border-radius: 99px; background: var(--locked); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--bolt); border-radius: 99px; transition: width .5s ease; }
.ticker { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; margin-top: 14px; border-block: 1px dashed var(--line); padding-block: 6px; }
.ticker-track { display: inline-block; animation: tick 40s linear infinite; }
.ticker .up { color: var(--good); } .ticker .dn { color: var(--bad); }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* ---------- unit banners + path ---------- */
.unit { margin-top: 26px; }
.unit-head { --c: var(--u1); background: var(--c); color: #fff; border-radius: var(--r); padding: 16px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 70%, #000); }
.unit-head .t { flex: 1; min-width: 0; }
.unit-head small { display: block; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: 12px; opacity: .85; }
.unit-head h2 { font-family: var(--f-display); font-size: 19px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
.unit-head p { margin: 4px 0 0; font-size: 14px; opacity: .92; }
.guide-btn { flex: none; border: 2px solid rgba(255,255,255,.45); background: rgba(255,255,255,.12); color: #fff; border-radius: 12px; padding: 8px 10px; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
.guide-btn:hover { background: rgba(255,255,255,.22); }

.path { display: flex; flex-direction: column; align-items: center; gap: 52px; padding-block: 56px 34px; }
.node-wrap { position: relative; }
.node { --c: var(--u1); width: 74px; height: 70px; border-radius: 50%; border: 0; background: var(--c); color: #fff; display: grid; place-items: center; box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 68%, #000); transition: transform .08s ease, box-shadow .08s ease; }
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 68%, #000); }
.node svg { width: 32px; height: 32px; }
.node.locked { background: var(--locked); color: var(--locked-ink); box-shadow: 0 7px 0 color-mix(in srgb, var(--locked) 80%, #000); }
.node.done { background: var(--c); }
.node.current { outline: 6px solid color-mix(in srgb, var(--c) 28%, transparent); outline-offset: 5px; }
.node-label { position: absolute; left: 50%; top: calc(100% + 12px); transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.bubble { position: absolute; left: 50%; bottom: calc(100% + 16px); transform: translateX(-50%); background: var(--surface); color: var(--c, var(--brand)); border: 2px solid var(--line); border-radius: 12px; padding: 6px 12px; font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
.bubble::after { content: ""; position: absolute; left: 50%; top: 100%; width: 12px; height: 12px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translate(-50%, -6px) rotate(45deg); }
@keyframes bob { 50% { transform: translate(-50%, -5px); } }

.disclaimer { margin-top: 36px; font-size: 12.5px; color: var(--muted); border-top: 2px solid var(--line); padding-top: 14px; }

/* ---------- generic cards / buttons ---------- */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; }
.h-sec { font-family: var(--f-display); font-size: 20px; font-weight: 700; margin: 26px 0 12px; }
.h-sec:first-child { margin-top: 0; }
.btn { --c: var(--brand); display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 14px; padding: 14px 18px; background: var(--c); color: #fff; font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 4px 0 color-mix(in srgb, var(--c) 68%, #000); transition: transform .06s, box-shadow .06s; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 68%, #000); }
.btn:disabled { background: var(--locked); color: var(--locked-ink); box-shadow: 0 4px 0 color-mix(in srgb, var(--locked) 82%, #000); cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--muted); box-shadow: none; border: 2px solid var(--line); }
.btn.warn { --c: var(--bad); }
.btn.alt { --c: var(--saffron); }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }

/* ---------- practice + profile ---------- */
.practice-card { display: flex; gap: 14px; align-items: center; }
.practice-card .ic { flex: none; width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; color: #fff; }
.practice-card .ic svg { width: 28px; height: 28px; }
.practice-card .meta { flex: 1; min-width: 0; }
.practice-card .meta b { display: block; }
.practice-card .meta small { color: var(--muted); }
.practice-card .btn { width: auto; flex: none; padding: 10px 14px; font-size: 13px; }
.stack { display: grid; gap: 12px; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { display: flex; gap: 10px; align-items: center; }
.tile svg { width: 26px; height: 26px; flex: none; }
.tile b { display: block; font-family: var(--f-mono); font-size: 20px; line-height: 1.1; }
.tile small { color: var(--muted); font-size: 13px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; }
.week div { display: grid; gap: 6px; justify-items: center; font-size: 12px; color: var(--muted); font-weight: 700; }
.week i { width: 30px; height: 30px; border-radius: 50%; background: var(--locked); display: grid; place-items: center; color: #fff; font-style: normal; }
.week i.hit { background: var(--flame); }
.week i.part { background: color-mix(in srgb, var(--flame) 35%, var(--locked)); }
.week i.today { outline: 2px solid var(--flame); outline-offset: 2px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
.badge { text-align: center; display: grid; justify-items: center; gap: 6px; }
.badge .medal { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; background: var(--saffron); color: #fff; transform: rotate(-4deg); box-shadow: 0 4px 0 color-mix(in srgb, var(--saffron) 65%, #000); }
.badge .medal svg { width: 28px; height: 28px; }
.badge.off .medal { background: var(--locked); color: var(--locked-ink); box-shadow: none; transform: none; }
.badge b { font-size: 13px; line-height: 1.2; }
.badge small { font-size: 11.5px; color: var(--muted); line-height: 1.25; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
.chip[aria-pressed="true"] { border-color: var(--brand); color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, var(--surface)); }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.setting:first-child { border-top: 0; }

/* ---------- bottom nav ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .col { display: flex; justify-content: space-around; padding-block: 6px; }
.tab { border: 2px solid transparent; background: none; border-radius: 14px; padding: 6px 16px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 45%, transparent); background: color-mix(in srgb, var(--brand) 9%, transparent); }

/* ---------- lesson screen ---------- */
.lesson { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.l-top { display: flex; align-items: center; gap: 14px; padding-block: 14px; }
.icon-btn { border: 0; background: none; color: var(--locked-ink); padding: 4px; display: grid; place-items: center; border-radius: 10px; }
.icon-btn svg { width: 26px; height: 26px; }
.pbar { flex: 1; height: 16px; border-radius: 99px; background: var(--locked); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 4px 0 rgba(255,255,255,.25); }
.l-body { flex: 1; overflow-y: auto; padding-block: 10px 24px; }
.l-body > .col { display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.kicker { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--saffron); display: flex; align-items: center; gap: 8px; }
.kicker .combo { color: var(--flame); }
.q { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.35; letter-spacing: -0.005em; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); border-radius: 14px; padding: 13px 14px; font-size: 16px; font-weight: 600; line-height: 1.35; }
.opt .k { flex: none; width: 26px; height: 26px; border: 2px solid var(--line); border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.opt:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 4%, var(--surface)); }
.opt[aria-pressed="true"] { border-color: #3B82D6; background: color-mix(in srgb, #3B82D6 12%, var(--surface)); color: var(--ink); }
.opt[aria-pressed="true"] .k { border-color: #3B82D6; color: #3B82D6; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.tf { grid-template-columns: 1fr 1fr; }
.tf .opt { justify-content: center; font-size: 18px; padding-block: 18px; }
.tf .opt .k { display: none; }

.teach { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 12px; }
.teach h3 { font-family: var(--f-display); font-size: 22px; font-weight: 700; line-height: 1.25; }
.teach p { margin: 0; }
.teach ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.term { justify-self: start; font-size: 13px; font-weight: 700; color: var(--brand); background: color-mix(in srgb, var(--brand) 11%, transparent); border-radius: 99px; padding: 3px 10px; }
.example { border-left: 4px solid var(--saffron); background: color-mix(in srgb, var(--saffron) 9%, transparent); border-radius: 0 12px 12px 0; padding: 10px 14px; font-size: 15px; }
.example b { font-family: var(--f-mono); font-weight: 700; }

.cloze { font-size: 20px; font-weight: 600; line-height: 1.6; }
.blank { display: inline-block; min-width: 110px; border-bottom: 3px solid var(--ink); text-align: center; padding: 0 6px; color: #3B82D6; }
.blank.empty { color: transparent; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; }
.bank .opt { width: auto; }
.bank .opt .k { display: none; }

.numwrap { display: flex; align-items: stretch; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; background: var(--surface); overflow: hidden; }
.numwrap span { display: grid; place-items: center; padding: 0 14px; font-family: var(--f-mono); font-weight: 700; font-size: 20px; color: var(--muted); background: color-mix(in srgb, var(--ink) 4%, var(--surface)); }
.numwrap input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 14px; font-family: var(--f-mono); font-size: 22px; font-weight: 700; color: var(--ink); }
.numwrap input:focus { outline: none; }
.numwrap:focus-within { border-color: #3B82D6; }
.hint { font-size: 13px; color: var(--muted); }

.order-ans { min-height: 64px; display: flex; flex-direction: column; gap: 8px; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); padding-block: 10px; }
.order-ans:empty::before { content: "Tap the steps below in order"; color: var(--locked-ink); font-weight: 600; font-size: 15px; padding: 10px 2px; }
.order-ans .opt .k { border-color: var(--brand); color: var(--brand); }

.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match .opt { justify-content: center; text-align: center; font-size: 14.5px; min-height: 64px; padding: 10px; }
.match .opt .k { display: none; }
.match .opt.done { opacity: .35; border-color: var(--good); background: var(--good-bg); }
.match .opt.flash { border-color: var(--bad); background: var(--bad-bg); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.l-foot { border-top: 2px solid var(--line); padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
.l-foot .col { display: grid; gap: 12px; }
.fb { display: none; gap: 4px; }
.fb .fb-title { font-family: var(--f-display); font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 8px; }
.fb .fb-title svg { width: 26px; height: 26px; }
.fb .fb-ans { font-weight: 700; }
.fb .fb-why { font-size: 15px; }
.l-foot.good { background: var(--good-bg); border-color: transparent; }
.l-foot.good .fb { display: grid; color: var(--good); }
.l-foot.good .btn { --c: var(--good); }
.l-foot.bad { background: var(--bad-bg); border-color: transparent; }
.l-foot.bad .fb { display: grid; color: var(--bad); }
.l-foot.bad .btn { --c: var(--bad); }
.l-foot .fb-why { color: var(--ink); }

.done-screen { text-align: center; align-items: center; justify-content: center; padding-top: 24px; }
.done-screen h2 { font-family: var(--f-display); font-size: 28px; color: var(--saffron); }
.done-screen p { margin: 0; color: var(--muted); }
.done-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.dt { --c: var(--bolt); border: 2px solid var(--c); border-radius: 14px; overflow: hidden; }
.dt small { display: block; background: var(--c); color: #fff; font-weight: 800; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; padding: 4px; }
.dt b { display: block; font-family: var(--f-mono); font-size: 20px; padding: 10px 4px; }
.new-badge { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; }
.trophy { width: 96px; height: 96px; color: var(--saffron); }

/* ---------- modal + toast ---------- */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(8, 16, 12, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 85%; overflow-y: auto; animation: up .2s ease; }
.sheet h3 { font-family: var(--f-display); font-size: 20px; }
.sheet p { margin: 0; color: var(--muted); }
.sheet .teach { border: 0; padding: 0; }
.sheet hr { border: 0; border-top: 2px solid var(--line); margin: 4px 0; width: 100%; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); }
canvas#confetti { position: fixed; inset: 0; z-index: 25; pointer-events: none; width: 100%; height: 100%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 380px) {
  .wordmark { font-size: 14px; }
  .stats { gap: 10px; }
  .q { font-size: 19px; }
}
</style>
</head>
<body>

<header class="topbar gut">
  <div class="col">
    <div class="wordmark">Dalal<span>Streak</span></div>
    <div class="stats">
      <div class="stat flame" id="st-streak" title="Day streak"></div>
      <div class="stat bolt" id="st-xp" title="Total XP"></div>
      <div class="stat heart" id="st-hearts" title="Hearts"></div>
    </div>
  </div>
</header>

<main class="app gut">
  <div class="col">

{ id:"u1", title:"Money Foundations", desc:"Budgets, inflation and staying safe on UPI", lessons:[

    { t:"teach", term:"Bachat · बचत", h:"The 50 / 30 / 20 rule", b:"<p>Split your <b>take-home pay</b> into three buckets:</p><ul><li><b>50%</b> needs: rent, groceries, EMIs, school fees, electricity</li><li><b>30%</b> wants: Swiggy orders, OTT, travel, gadgets</li><li><b>20%</b> savings and investments: SIPs, PPF, emergency fund</li></ul>", ex:"Take-home <b>₹50,000</b> → needs <b>₹25,000</b>, wants <b>₹15,000</b>, savings <b>₹10,000</b>" },

    { t:"tf", q:"You must enter your UPI PIN to receive a refund.", a:false, w:"Receiving money never needs a PIN. Anyone asking you to enter it “to receive” is trying to take your money." },

    { t:"tf", q:"FD interest is taxed at your income tax slab rate.", a:true, w:"FD interest is added to your income and taxed at your slab. Banks deduct TDS above a threshold." },

    { t:"match", p:[["SEBI","Market regulator"],["Sensex","30-stock BSE index"],["Nifty 50","50-stock NSE index"],["Dalal Street","Home of the BSE"]], w:"These names show up in every market headline." },

    { t:"cloze", s:"Dalal Street in Mumbai is home to the ___.", o:["BSE","NSE","RBI"], a:0, w:"The BSE is on Dalal Street. The NSE is in Bandra Kurla Complex." },
    { t:"tf", q:"If the Sensex rises 1% today, every stock in it went up.", a:false, w:"An index is a weighted average. Some stocks can fall while the index rises." }

    { t:"teach", term:"T+1", h:"What you need to buy a share", b:"<ul><li><b>PAN</b> and <b>KYC</b> (Aadhaar, bank details)</li><li>A <b>Demat account</b>, which holds shares electronically at a depository: <b>NSDL</b> or <b>CDSL</b></li><li>A <b>trading account</b> with a SEBI-registered broker</li></ul><p>India settles trades on <b>T+1</b>: shares you buy today land in your Demat account the next trading day.</p>" },
    { t:"order", q:"Put the steps to buy your first share in order.", o:["Keep PAN and Aadhaar ready","Complete KYC with a broker","Open Demat and trading accounts","Add money from your bank","Place a buy order"], w:"KYC and accounts come first, then money, then the order." },
    { t:"mcq", q:"What does a Demat account do?", o:["Holds your shares electronically","Lends you money to trade","Gives you stock tips","Pays you interest"], a:0, w:"Demat = dematerialised. It replaced paper share certificates." },

    { t:"mcq", q:"You buy shares on Monday. When do they reach your Demat account?", o:["Tuesday (T+1)","Monday evening","Wednesday (T+2)","Next Monday"], a:0, w:"India moved to T+1 settlement in 2023, one of the fastest cycles in the world." }

{ id:"u4", title:"Mutual Funds and SIPs", desc:"NAV, SIPs, compounding and choosing funds", lessons:[
  { id:"u4l1", title:"How mutual funds work", items:[
    { t:"teach", h:"A shared basket of investments", b:"<p>A mutual fund pools money from many investors. A fund manager at an <b>AMC</b> invests it.</p><ul><li><b>NAV</b>: the value of one unit, calculated every business day.</li><li><b>Expense ratio</b>: the yearly fee, taken out of the fund.</li><li><b>Direct plans</b> skip distributor commission, so they cost less than <b>regular plans</b>.</li></ul>", ex:"Invest <b>₹10,000</b> at NAV <b>₹50</b> → you get <b>200 units</b>" },
    { t:"mcq", q:"What is NAV?", o:["The value of one unit of the fund","The fund’s yearly return","The minimum investment","The fund manager’s fee"], a:0, w:"Net Asset Value = (assets − liabilities) ÷ number of units." },
    { t:"num", q:"You invest ₹10,000 in a fund at a NAV of ₹50. How many units do you get?", a:200, w:"₹10,000 ÷ ₹50 = 200 units." },
    { t:"mcq", q:"Why does a direct plan usually return more than the regular plan of the same fund?", o:["It has a lower expense ratio","It has a better fund manager","It invests in different stocks","It is guaranteed by SEBI"], a:0, w:"Same portfolio, no distributor commission, so the yearly fee is lower." },
    { t:"tf", q:"A fund with NAV ₹500 is more expensive than one with NAV ₹20.", a:false, w:"NAV only shows the price per unit. Your returns depend on percentage growth, not the NAV level." }
  ]},

    { t:"mcq", q:"What is rupee cost averaging?", o:["Buying more units when prices are low and fewer when high","Always buying at the lowest price","Getting a fixed return each month","Averaging your losses across stocks"], a:0, w:"A fixed SIP amount automatically buys more units in a dip." },
    { t:"num", q:"You run a ₹5,000 monthly SIP for 10 years. How much money did you put in?", pre:"₹", a:600000, w:"₹5,000 × 12 × 10 = ₹6,00,000. Growth comes on top." },

}));

/* ================= state ================= */
const KEY = "dalal-streak-v1";
const MAX_HEARTS = 5, REFILL_MS = 30 * 60 * 1000;
const fresh = () => ({ xp: 0, streak: 0, best: 0, lastDay: null, hearts: MAX_HEARTS, heartsAt: null, done: {}, mistakes: [], daily: {}, goal: 30, perfects: 0, sound: true });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayOffset(n) { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); }
const today = () => dayOffset(0);
function liveStreak() { return (S.lastDay === today() || S.lastDay === dayOffset(-1)) ? S.streak : 0; }
function bumpStreak() {
  const t = today(); if (S.lastDay === t) return;
  S.streak = S.lastDay === dayOffset(-1) ? S.streak + 1 : 1;
  S.lastDay = t; S.best = Math.max(S.best, S.streak);
}
function refreshHearts() {
  if (S.hearts >= MAX_HEARTS) { S.hearts = MAX_HEARTS; S.heartsAt = null; return; }
  const now = Date.now(); if (!S.heartsAt) S.heartsAt = now;
  const n = Math.floor((now - S.heartsAt) / REFILL_MS);
  if (n > 0) { S.hearts = Math.min(MAX_HEARTS, S.hearts + n); S.heartsAt = S.hearts >= MAX_HEARTS ? null : S.heartsAt + n * REFILL_MS; save(); }
}
function nextHeartIn() { if (!S.heartsAt) return 0; return Math.max(0, REFILL_MS - (Date.now() - S.heartsAt)); }
const fmtINR = n => Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const mmss = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $ = id => document.getElementById(id);

function isUnlocked(i) { return i === 0 || !!S.done[LESSONS[i - 1].id]; }
function currentIndex() { const i = LESSONS.findIndex(l => !S.done[l.id]); return i; }

/* ================= sound ================= */
let AC = null;
function tone(seq) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f, d]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "triangle"; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.start(t); o.stop(t + d + 0.02); t += d * 0.8;
    });
  } catch (e) {}
}
const sfx = { good: () => tone([[660, .12], [990, .2]]), bad: () => tone([[220, .18], [180, .22]]), win: () => tone([[523, .12], [659, .12], [784, .12], [1047, .3]]) };

const OFFS = [0, 46, 70, 46, 0, -46, -70, -46];
function renderPath() {
  const cur = currentIndex();
  let gi = 0, html = "";
  UNITS.forEach((u, ui) => {
    const color = "var(--u" + (ui + 1) + ")";
    const firstIdx = LESSONS.indexOf(u.lessons[0]);
    const locked = !isUnlocked(firstIdx);
    html += '<section class="unit' + (locked ? " locked" : "") + '"><div class="unit-head" style="--c:' + color + '"><div class="t"><small>Unit ' + (ui + 1) + '</small><h2>' + u.title + '</h2><p>' + u.desc + '</p></div><button class="guide-btn" data-guide="' + u.id + '">' + "Guide" + '</button></div><div class="path">';
    u.lessons.forEach(l => {
      const i = LESSONS.indexOf(l);
      const done = !!S.done[l.id], unlocked = isUnlocked(i), isCur = i === cur;
      const cls = done ? "done" : unlocked ? "" : "locked";
      const icon = done ? I.check : unlocked ? I.star : I.lock;
      html += '<div class="node-wrap" style="transform:translateX(' + OFFS[gi % OFFS.length] + 'px);--c:' + color + '">' +
        (isCur ? '<div class="bubble">' + (Object.keys(S.done).length ? "Next" : "Start") + '</div>' : "") +
        '<button class="node ' + cls + (isCur ? " current" : "") + '" style="--c:' + color + '" data-lesson="' + i + '" aria-label="' + l.title + (done ? ", completed" : unlocked ? "" : ", locked") + '">' + icon + '</button>' +
        '<div class="node-label">' + l.title + '</div></div>';
      gi++;
    });
    html += "</div></section>";
  });
  $("path").innerHTML = html;
}

    '<h2 class="h-sec">This week</h2><div class="card"><div class="week">' + days.join("") + '</div></div>' +
    '<h2 class="h-sec">Badges</h2><div class="badges">' +
    BADGES.map(b => '<div class="badge' + (got.includes(b.id) ? "" : " off") + '"><div class="medal">' + b.ic + '</div><b>' + b.name + '</b><small>' + b.d + '</small></div>').join("") +
    '</div>' +
    '<h2 class="h-sec">Settings</h2><div class="card">' +
    '<div class="setting" style="display:grid"><b>Daily goal</b><div class="chips">' +
    [[10, "Casual"], [20, "Regular"], [30, "Serious"], [50, "Intense"]].map(([g, n]) => '<button class="chip" data-goal="' + g + '" aria-pressed="' + (S.goal === g) + '">' + n + ' · ' + g + ' XP</button>').join("") + '</div></div>' +
    '<div class="setting"><b>Sound effects</b><button class="chip" id="sound-t" aria-pressed="' + S.sound + '">' + (S.sound ? "On" : "Off") + '</button></div>' +
    '<div class="setting"><div><b>Reset progress</b><br><small style="color:var(--muted)">Clears XP, streak and lessons on this device</small></div><button class="chip" id="reset-btn" style="color:var(--bad)">Reset</button></div>' +
    '</div>';
}

/* ================= tabs ================= */
let TAB = "learn";
function showTab(t) {
  TAB = t;
  document.querySelectorAll(".tab").forEach(b => b.toggleAttribute("aria-current", false));
  document.querySelector('.tab[data-tab="' + t + '"]').setAttribute("aria-current", "page");
  ["learn", "practice", "profile"].forEach(v => $("v-" + v).hidden = v !== t);
  renderAll(); window.scrollTo(0, 0);
}
function renderAll() {
  renderStats();
  if (TAB === "learn") renderPath();
  if (TAB === "practice") renderPractice();
  if (TAB === "profile") renderProfile();
}

/* ================= modal + toast ================= */
function openModal(html) { $("sheet").innerHTML = html; $("modal").hidden = false; const f = $("sheet").querySelector("button"); if (f) f.focus(); }
function closeModal() { $("modal").hidden = true; }
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

function openGuide(uid) {
  const u = UNITS.find(x => x.id === uid);
  const cards = u.lessons.flatMap(l => l.items.filter(it => it.t === "teach"));
  openModal('<h3>' + u.title + ' guide</h3><p>The key ideas from this unit, in one place.</p>' +
    cards.map(c => '<hr><div class="teach">' + (c.term ? '<span class="term">' + c.term + '</span>' : "") + '<h3 style="font-size:18px">' + c.h + '</h3>' + c.b + (c.ex ? '<div class="example">' + c.ex + '</div>' : "") + '</div>').join("") +
    '<button class="btn" data-close>Close</button>');
}

function openLessonSheet(i) {
  const l = LESSONS[i];
  if (!isUnlocked(i)) { toast("Finish the lesson before this one to unlock it"); return; }
  const qn = l.items.filter(it => it.t !== "teach").length;
  const done = !!S.done[l.id];
  openModal('<span class="term" style="color:var(--u' + (l.ui + 1) + ');background:color-mix(in srgb, var(--u' + (l.ui + 1) + ') 12%, transparent)">Unit ' + (l.ui + 1) + ' · Lesson ' + (l.li + 1) + ' of ' + l.unit.lessons.length + '</span>' +
    '<h3>' + l.title + '</h3><p>' + qn + ' questions · ' + (done ? "Review for +5 XP" : "+10 XP, +5 for a perfect run") + (done ? " · best accuracy " + S.done[l.id].acc + "%" : "") + '</p>' +
    '<button class="btn" style="--c:var(--u' + (l.ui + 1) + ')" data-start="' + i + '">' + (done ? "Review lesson" : "Start lesson") + '</button>' +
    '<button class="btn ghost" data-close>Not now</button>');
}

/* ================= lesson engine ================= */
let L = null;
function startLesson(i) {
  refreshHearts();
  if (S.hearts <= 0) { noHeartsModal(); return; }
  const l = LESSONS[i];
  beginSession({ mode: "lesson", lesson: l, items: l.items.slice() });
}
function startPractice(kind) {
  let items;
  if (kind === "mistakes") items = shuffle(S.mistakes.map(id => ITEM_BY_ID[id]).filter(Boolean)).slice(0, 10);
  else items = shuffle(reviewPool()).slice(0, 8);
  if (!items.length) { toast("Nothing to practice yet"); return; }
  beginSession({ mode: "practice", kind, items });
}
function beginSession(o) {
  closeModal();
  L = { mode: o.mode, kind: o.kind, lesson: o.lesson, queue: o.items.map(it => Object.assign({}, it)), idx: 0, total: o.items.length,
        done: 0, questions: o.items.filter(it => it.t !== "teach").length, firstMiss: new Set(), combo: 0, t0: Date.now(), phase: "answer" };
  $("lesson").hidden = false; document.body.style.overflow = "hidden";
  renderItem();
}
function endSession() { L = null; $("lesson").hidden = true; document.body.style.overflow = ""; renderAll(); }

function setProg() { $("l-prog").style.width = (100 * L.done / L.total) + "%"; $("l-hearts").innerHTML = L.mode === "lesson" ? I.heart + "<span>" + S.hearts + "</span>" : '<span style="font-size:12px;color:var(--muted);font-family:var(--f-body)">PRACTICE</span>'; }
function resetFoot() { $("l-foot").className = "l-foot gut"; $("fb-title").innerHTML = ""; $("fb-ans").textContent = ""; $("fb-why").textContent = ""; }
function setCheck(label, enabled) { const b = $("l-check"); b.textContent = label; b.disabled = !enabled; b.hidden = false; }

const KICK = { mcq: "Choose the right answer", tf: "True or false?", num: "Work it out", cloze: "Fill in the blank", match: "Tap the matching pairs", order: "Put these in order" };
function renderItem() {
  const it = L.queue[L.idx];
  L.phase = it.t === "teach" ? "teach" : "answer"; L.sel = null; L.opts = null;
  resetFoot(); setProg();
  const body = $("l-body");
  const kick = it.t === "teach" ? '<div class="kicker">New concept</div>' :
    '<div class="kicker">' + (it._retry ? "Previous mistake · " : "") + KICK[it.t] + (L.combo >= 3 ? ' <span class="combo">· ' + L.combo + ' in a row</span>' : "") + '</div>';
  let h = '<div class="col">' + kick;
  if (it.t === "teach") {
    h += '<div class="teach">' + (it.term ? '<span class="term">' + it.term + '</span>' : "") + '<h3>' + it.h + '</h3>' + it.b + (it.ex ? '<div class="example">' + it.ex + '</div>' : "") + '</div>';
    setCheck("Got it", true);
  } else if (it.t === "mcq" || it.t === "tf") {
    L.opts = it.t === "tf" ? [{ x: "True", ok: it.a === true }, { x: "False", ok: it.a === false }] : shuffle(it.o.map((x, k) => ({ x, ok: k === it.a })));
    h += '<div class="q">' + it.q + '</div><div class="opts' + (it.t === "tf" ? " tf" : "") + '">' +
      L.opts.map((o, k) => '<button class="opt" data-opt="' + k + '" aria-pressed="false"><span class="k">' + (k + 1) + '</span><span>' + o.x + '</span></button>').join("") + '</div>';
    setCheck("Check", false);
  } else if (it.t === "cloze") {
    L.opts = shuffle(it.o.map((x, k) => ({ x, ok: k === it.a })));
    h += '<div class="cloze">' + it.s.replace("___", '<span class="blank empty" id="blank">____</span>') + '</div><div class="bank">' +
      L.opts.map((o, k) => '<button class="opt" data-opt="' + k + '" aria-pressed="false"><span class="k">' + (k + 1) + '</span><span>' + o.x + '</span></button>').join("") + '</div>';
    setCheck("Check", false);
  } else if (it.t === "num") {
    h += '<div class="q">' + it.q + '</div><label class="numwrap">' + (it.pre ? '<span>' + it.pre + '</span>' : "") +
      '<input id="num-in" inputmode="decimal" autocomplete="off" placeholder="Your answer" aria-label="Your answer"></label><div class="hint">Commas are fine, like 1,50,000.</div>';
    setCheck("Check", false);
  } else if (it.t === "order") {
    L.sel = []; L.bank = shuffle(it.o.map((x, k) => k));
    h += '<div class="q">' + it.q + '</div><div class="order-ans" id="ord-ans"></div><div class="opts" id="ord-bank"></div>';
    setCheck("Check", false);
  } else if (it.t === "match") {
    L.left = shuffle(it.p.map((p, k) => k)); L.right = shuffle(it.p.map((p, k) => k)); L.pick = null; L.matched = 0; L.matchErr = 0;
    h += '<div class="q">Match each term to its meaning</div><div class="match">' +
      L.left.map((k, r) => '<button class="opt" data-side="l" data-k="' + k + '" style="grid-column:1;grid-row:' + (r + 1) + '">' + it.p[k][0] + '</button>' +
        '<button class="opt" data-side="r" data-k="' + L.right[r] + '" style="grid-column:2;grid-row:' + (r + 1) + '">' + it.p[L.right[r]][1] + '</button>').join("") + '</div>';
    $("l-check").hidden = true;
  }
  h += "</div>";
  body.innerHTML = h; body.scrollTop = 0;
  if (it.t === "order") renderOrder();
  if (it.t === "num") { const inp = $("num-in"); inp.addEventListener("input", () => { $("l-check").disabled = parseNum(inp.value) === null; }); setTimeout(() => inp.focus(), 50); }
}
function parseNum(s) { s = String(s).replace(/[₹,\s]/g, "").replace(/lakh|lac/i, "e5").replace(/crore|cr/i, "e7"); if (!s) return null; const v = Number(s); return isFinite(v) ? v : null; }
function renderOrder() {
  const it = L.queue[L.idx];
  $("ord-ans").innerHTML = L.sel.map((k, n) => '<button class="opt" data-ord-rm="' + n + '"><span class="k">' + (n + 1) + '</span><span>' + it.o[k] + '</span></button>').join("");
  $("ord-bank").innerHTML = L.bank.filter(k => !L.sel.includes(k)).map(k => '<button class="opt" data-ord-add="' + k + '"><span class="k">·</span><span>' + it.o[k] + '</span></button>').join("");
  $("l-check").disabled = L.sel.length !== it.o.length;
}

function selectOpt(k) {
  if (L.phase !== "answer") return;
  L.sel = k;
  document.querySelectorAll("#l-body [data-opt]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.opt === k)));
  const blank = $("blank"); if (blank) { blank.textContent = L.opts[k].x; blank.classList.remove("empty"); }
  $("l-check").disabled = false;
}

function check() {
  const it = L.queue[L.idx];
  let ok = false, ans = "";
  if (it.t === "mcq" || it.t === "tf" || it.t === "cloze") {
    if (L.sel === null) return;
    ok = L.opts[L.sel].ok; const ri = L.opts.findIndex(o => o.ok); ans = L.opts[ri].x;
    document.querySelectorAll("#l-body [data-opt]").forEach(b => { const k = +b.dataset.opt; b.disabled = true; if (k === ri) b.classList.add("right"); else if (k === L.sel) b.classList.add("wrong"); });
  } else if (it.t === "num") {
    const v = parseNum($("num-in").value); if (v === null) return;
    const tol = it.tol != null ? it.tol : Math.max(0.01, Math.abs(it.a) * 0.001);
    ok = Math.abs(v - it.a) <= tol; ans = (it.pre || "") + fmtINR(it.a);
    $("num-in").disabled = true;
  } else if (it.t === "order") {
    ok = L.sel.every((k, n) => k === n); ans = it.o.map((x, n) => (n + 1) + ". " + x).join("  ");
    document.querySelectorAll("#ord-ans .opt").forEach((b, n) => { b.disabled = true; b.classList.add(L.sel[n] === n ? "right" : "wrong"); });
  }
  grade(ok, it, ans);
}

const PRAISE = ["Nicely done!", "Correct!", "Spot on!", "Shabash!", "Bang on!", "Great work!"];
function grade(ok, it, ans) {
  L.phase = "feedback";
  const foot = $("l-foot");
  if (ok) {
    L.done++; L.combo++;
    if (L.mode === "practice") S.mistakes = S.mistakes.filter(id => id !== it.id);
    foot.classList.add("good");
    $("fb-title").innerHTML = I.check + PRAISE[Math.floor(Math.random() * PRAISE.length)];
    $("fb-ans").textContent = "";
    sfx.good();
  } else {
    L.combo = 0; L.firstMiss.add(it.id);
    if (L.mode === "lesson") { S.hearts = Math.max(0, S.hearts - 1); if (!S.heartsAt) S.heartsAt = Date.now(); }
    if (!S.mistakes.includes(it.id)) S.mistakes.push(it.id);
    L.queue.push(Object.assign({}, it, { _retry: true }));
    foot.classList.add("bad");
    $("fb-title").innerHTML = I.x + "Not quite";
    $("fb-ans").textContent = "Correct answer: " + ans;
    sfx.bad();
  }
  $("fb-why").textContent = it.w || "";
  save(); setProg();
  setCheck("Continue", true); $("l-check").focus();
}

function nextItem() {
  if (L.mode === "lesson" && S.hearts <= 0) { outOfHeartsInLesson(); return; }
  L.idx++;
  if (L.idx >= L.queue.length) finish(); else renderItem();
}

function matchTap(btn) {
  if (L.phase !== "answer" || btn.classList.contains("done")) return;
  const it = L.queue[L.idx];
  if (!L.pick || L.pick.dataset.side === btn.dataset.side) {
    if (L.pick) L.pick.setAttribute("aria-pressed", "false");
    L.pick = btn; btn.setAttribute("aria-pressed", "true"); return;
  }
  const a = L.pick, b = btn; L.pick = null; a.setAttribute("aria-pressed", "false");
  if (a.dataset.k === b.dataset.k) {
    [a, b].forEach(x => { x.classList.add("done"); x.disabled = true; });
    L.matched++; tone([[700 + L.matched * 80, .1]]);
    if (L.matched === it.p.length) {
      if (L.matchErr === 0) grade(true, it, "");
      else { // count as done but note it for review, no heart lost
        L.done++; L.combo = 0; L.firstMiss.add(it.id); L.phase = "feedback";
        if (!S.mistakes.includes(it.id)) S.mistakes.push(it.id);
        $("l-foot").classList.add("good");
        $("fb-title").innerHTML = I.check + "All matched";
        $("fb-ans").textContent = L.matchErr + " wrong tap" + (L.matchErr > 1 ? "s" : "") + ". This set is saved to Practice.";
        $("fb-why").textContent = it.w || ""; save(); setProg(); setCheck("Continue", true); sfx.good();
      }
    }
  } else {
    L.matchErr++;
    [a, b].forEach(x => { x.classList.remove("flash"); void x.offsetWidth; x.classList.add("flash"); setTimeout(() => x.classList.remove("flash"), 400); });
    tone([[200, .12]]);
  }
}

function finish() {
  const before = earned();
  const secs = Math.round((Date.now() - L.t0) / 1000);
  const acc = L.questions ? Math.round(100 * (L.questions - L.firstMiss.size) / L.questions) : 100;
  let xp, sub;
  if (L.mode === "lesson") {
    const again = !!S.done[L.lesson.id];
    xp = (again ? 5 : 10) + (L.firstMiss.size === 0 ? 5 : 0);
    if (L.firstMiss.size === 0) S.perfects++;
    S.done[L.lesson.id] = { acc: Math.max(acc, again ? S.done[L.lesson.id].acc : 0), at: Date.now() };
    sub = L.lesson.title;
  } else {
    xp = 10; S.hearts = Math.min(MAX_HEARTS, S.hearts + 1); if (S.hearts >= MAX_HEARTS) S.heartsAt = null;
    sub = L.kind === "mistakes" ? "Mistakes reviewed" : "Mixed review";
  }
  S.xp += xp; S.daily[today()] = (S.daily[today()] || 0) + xp; bumpStreak(); save();
  const newBadges = earned().filter(id => !before.includes(id)).map(id => BADGES.find(b => b.id === id));
  L.phase = "complete"; resetFoot(); $("l-prog").style.width = "100%";
  $("l-body").innerHTML = '<div class="col done-screen"><div class="trophy">' + I.trophy + '</div><h2>' + (L.mode === "lesson" ? "Lesson complete!" : "Practice complete!") + '</h2><p>' + sub + (L.mode === "practice" ? " · +1 heart" : "") + '</p>' +
    '<div class="done-tiles"><div class="dt"><small>Total XP</small><b>+' + xp + '</b></div><div class="dt" style="--c:var(--good)"><small>Accuracy</small><b>' + acc + '%</b></div><div class="dt" style="--c:var(--u2)"><small>Time</small><b>' + mmss(secs * 1000) + '</b></div></div>' +
    '<div class="card new-badge"><span style="color:var(--flame);width:34px;height:34px;flex:none">' + I.flame + '</span><div><b>' + liveStreak() + ' day streak</b><br><small style="color:var(--muted)">' + ((S.daily[today()] || 0) >= S.goal ? "Daily goal met" : (S.goal - (S.daily[today()] || 0)) + " XP left for today’s goal") + '</small></div></div>' +
    newBadges.map(b => '<div class="card new-badge"><div class="badge"><div class="medal">' + b.ic + '</div></div><div><b>Badge unlocked: ' + b.name + '</b><br><small style="color:var(--muted)">' + b.d + '</small></div></div>').join("") +
    '</div>';
  setCheck("Continue", true);
  sfx.win(); confetti();
}

function outOfHeartsInLesson() {
  L.phase = "nohearts"; resetFoot();
  $("l-body").innerHTML = '<div class="col done-screen"><div class="trophy" style="color:var(--heart)">' + I.heart + '</div><h2 style="color:var(--heart)">Out of hearts</h2><p>A new heart arrives in <b class="num" id="heart-clock">' + mmss(nextHeartIn()) + '</b>. Or finish a practice session to earn one back now.</p>' +
    '<div class="stack" style="width:100%"><button class="btn" data-practice="' + (S.mistakes.length ? "mistakes" : "mixed") + '">Practice to earn a heart</button></div></div>';
  setCheck("Back to lessons", true);
}
function noHeartsModal() {
  openModal('<h3>You’re out of hearts</h3><p>A new heart arrives in <b class="num">' + mmss(nextHeartIn()) + '</b>. Practice never costs hearts, and each session earns one back.</p>' +
    '<button class="btn" data-practice="' + (S.mistakes.length ? "mistakes" : "mixed") + '"' + (S.mistakes.length || reviewPool().length ? "" : " disabled") + '>Practice to earn a heart</button><button class="btn ghost" data-close>Not now</button>');
}

/* ================= confetti ================= */
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("confetti"); c.hidden = false;
  const ctx = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--saffron", "--brand", "--u2", "--u4", "--bolt", "--u7"].map(v => cs.getPropertyValue(v).trim());
  const P = Array.from({ length: 110 }, () => ({ x: W / 2, y: H * 0.35, vx: (Math.random() - .5) * 14, vy: Math.random() * -13 - 3, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, s: (Math.random() - .5) * .3 }));
  let f = 0;
  (function step() {
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(step); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })();
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) return showTab(t.dataset.tab);
  if (t.dataset.lesson != null) return openLessonSheet(+t.dataset.lesson);
  if (t.dataset.start != null) return startLesson(+t.dataset.start);
  if (t.dataset.guide) return openGuide(t.dataset.guide);
  if (t.dataset.practice) { if (L) { L = null; $("lesson").hidden = true; } return startPractice(t.dataset.practice); }
  if (t.hasAttribute("data-close")) return closeModal();
  if (t.dataset.goal) { S.goal = +t.dataset.goal; save(); return renderAll(); }
  if (t.id === "sound-t") { S.sound = !S.sound; save(); return renderAll(); }
  if (t.id === "reset-btn") return openModal('<h3>Reset all progress?</h3><p>This clears your XP, streak, badges and finished lessons on this device. It can’t be undone.</p><button class="btn warn" id="reset-yes">Reset progress</button><button class="btn ghost" data-close>Keep my progress</button>');
  if (t.id === "reset-yes") { const g = S.goal, snd = S.sound; S = fresh(); S.goal = g; S.sound = snd; save(); closeModal(); toast("Progress reset"); return renderAll(); }
  if (!L) return;
  if (t.dataset.opt != null) return selectOpt(+t.dataset.opt);
  if (t.dataset.side) return matchTap(t);
  if (t.dataset.ordAdd != null) { L.sel.push(+t.dataset.ordAdd); return renderOrder(); }
  if (t.dataset.ordRm != null && L.phase === "answer") { L.sel.splice(+t.dataset.ordRm, 1); return renderOrder(); }
  if (t.id === "l-check") {
    if (L.phase === "answer") return check();
    if (L.phase === "teach") { L.done++; return nextItem(); }
    if (L.phase === "feedback") return nextItem();
    if (L.phase === "complete" || L.phase === "nohearts") return endSession();
  }
  if (t.id === "l-close") {
    if (L.phase === "complete" || L.phase === "nohearts") return endSession();
    return openModal('<h3>Quit this ' + (L.mode === "lesson" ? "lesson" : "practice") + '?</h3><p>You’ll lose your progress in it. Hearts you’ve lost stay lost.</p><button class="btn" data-close>Keep learning</button><button class="btn ghost warn" id="quit-yes" style="color:var(--bad)">Quit</button>');
  }
  if (t.id === "quit-yes") { closeModal(); return endSession(); }
});

document.addEventListener("keydown", e => {
  if (!$("modal").hidden) { if (e.key === "Escape") closeModal(); return; }
  if (!L) return;
  if (e.key === "Enter" && !$("l-check").disabled && !$("l-check").hidden) { e.preventDefault(); $("l-check").click(); return; }
  if (L.phase === "answer" && /^[1-9]$/.test(e.key) && L.opts && document.activeElement.id !== "num-in") {
    const k = +e.key - 1; if (document.querySelector('#l-body [data-opt="' + k + '"]')) selectOpt(k);
  }
});

setInterval(() => {
  const before = S.hearts; refreshHearts();
  if (S.hearts !== before && !L) renderStats();
  const hc = $("heart-clock"); if (hc) hc.textContent = mmss(nextHeartIn());
}, 1000);

renderTicker();
renderAll();
</script>
</body>
</html>
